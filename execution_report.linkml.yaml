id: https://elixir-europe.org/platforms/compute/execution_report.linkml.yaml
name: execution_report
description: Gives credit for the specific execution of a data analysis tool.
prefixes:
  linkml: https://w3id.org/linkml/
  report: https://w3id.example.com/execution_report#
imports:
  - linkml:types
default_range: string
default_prefix: report

classes:
  Provider:
    description: Infrastructure provider
    attributes:
      infra_name:
      infra_identifier:
        multivalued: true
        inlined_as_list: true
      infra_version:

  Address:
    description: |
      The name of the physical location where the computation took place.
    class_uri: schema:PostalAddress
    attributes:
      addressCountry:
        slot_uri: schema:addressCountry
      postalCode:
        slot_uri: schema:postalCode
      addressRegion:
        slot_uri: schema:addressRegion
      addressLocality:
        slot_uri: schema:addressLocality
  Location:
    class_uri: schema:Place
    attributes:
      name:
      address:
        range: Address

  Report:
    description: "Tool execution report. Gives credit for the specific execution of a data analysis tool."
    tree_root: true
    attributes:
      report_format_version:
        description: "The version of the execution schema used."
        pattern: "0.0.2"
      affiliation:
        multivalued: true
        inlined_as_list: true
      tool_identifier:
        multivalued: true
        inlined_as_list: true
      tool_name:
      tool_version:
        slot_uri: schema:softwareVersion
      tool_package_version:
      input_size:
        range: integer
      infra:
        multivalued: true
        inlined_as_list: true
        range: report:Provider
      location:
        range: Location
      cpu_identifier:
      cpu_mods:
      cpu_cores_assigned:
        range: integer
      start_time:
      end_time:
      duration:
      final_outputs_size:
        range: integer
      memory_used:
        range: integer
      cpu_cores_used:
        range: integer
      gpu_cores_used:
        range: integer

